<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wordle-style Game</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="game">
    <header class="game-header">
      <h1>Wordle</h1>
      <p class="instructions">
        Guess the five-letter word in six tries.
      </p>
    </header>

    <section
      class="board"
      aria-label="Guess board"
    >
      <div class="row" aria-label="Guess 1">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 2">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 3">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 4">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 5">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 6">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>
    </section>

    <p class="evaluation-key" aria-label="Guess result key">
      <span><strong>Green</strong> = correct position</span>
      <span><strong>Yellow</strong> = correct letter, wrong position</span>
      <span><strong>Grey</strong> = letter not present</span>
    </p>

    <section
      class="keyboard"
      aria-label="On-screen keyboard"
    >
      <div class="keyboard-row">
        <button type="button" data-key="Q">Q</button>
        <button type="button" data-key="W">W</button>
        <button type="button" data-key="E">E</button>
        <button type="button" data-key="R">R</button>
        <button type="button" data-key="T">T</button>
        <button type="button" data-key="Y">Y</button>
        <button type="button" data-key="U">U</button>
        <button type="button" data-key="I">I</button>
        <button type="button" data-key="O">O</button>
        <button type="button" data-key="P">P</button>
      </div>

      <div class="keyboard-row keyboard-row-middle">
        <button type="button" data-key="A">A</button>
        <button type="button" data-key="S">S</button>
        <button type="button" data-key="D">D</button>
        <button type="button" data-key="F">F</button>
        <button type="button" data-key="G">G</button>
        <button type="button" data-key="H">H</button>
        <button type="button" data-key="J">J</button>
        <button type="button" data-key="K">K</button>
        <button type="button" data-key="L">L</button>
      </div>

      <div class="keyboard-row">
        <button
          type="button"
          class="keyboard-wide"
          data-key="enter"
        >
          Enter
        </button>

        <button type="button" data-key="Z">Z</button>
        <button type="button" data-key="X">X</button>
        <button type="button" data-key="C">C</button>
        <button type="button" data-key="V">V</button>
        <button type="button" data-key="B">B</button>
        <button type="button" data-key="N">N</button>
        <button type="button" data-key="M">M</button>

        <button
          type="button"
          class="keyboard-wide"
          data-key="backspace"
          aria-label="Backspace"
        >
          ←
        </button>
      </div>
    </section>

    <p
      class="stage-status"
      role="status"
      aria-live="polite"
    >
      Stage 8: Polish and accessibility
    </p>

    <button
      id="new-game"
      type="button"
      hidden
    >
      New Game
    </button>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
