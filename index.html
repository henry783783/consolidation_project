<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!--
    Ensures the layout uses the device's actual width on mobile.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wordle-Style Game</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="game">
    <header class="game-header">
      <h1>Wordle</h1>
      <p class="instructions">
        Guess the five-letter word in six tries.
      </p>
    </header>

    <!--
      The board is currently visual only.

      Each row represents one possible guess.
      Each tile represents one letter.

      JavaScript will populate and update these tiles in a later stage.
    -->
    <section
      class="board"
      aria-label="Word guessing board"
    >
      <div class="row" aria-label="Guess 1">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 2">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 3">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 4">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 5">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 6">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>
    </section>

    <p class="stage-status">
      Stage 2 — Board layout ready
    </p>
  </main>
</body>
</html>
