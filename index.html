<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wordle-Style Game</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="game">
    <header class="game-header">
      <h1>Wordle</h1>
      <p class="instructions">
        Guess the five-letter word in six tries.
      </p>
    </header>

    <!--
      The board is controlled by js/game.js.

      Stage 5 allows complete five-letter guesses to be submitted.
      Valid guesses move to the next row.
    -->
    <section
      class="board"
      aria-label="Word guessing board"
    >
      <div class="row" aria-label="Guess 1">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 2">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 3">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 4">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 5">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <div class="row" aria-label="Guess 6">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>
    </section>

    <section
      class="keyboard"
      aria-label="On-screen keyboard"
    >
      <div class="keyboard-row">
        <button type="button" data-key="q" aria-label="Q">Q</button>
        <button type="button" data-key="w" aria-label="W">W</button>
        <button type="button" data-key="e" aria-label="E">E</button>
        <button type="button" data-key="r" aria-label="R">R</button>
        <button type="button" data-key="t" aria-label="T">T</button>
        <button type="button" data-key="y" aria-label="Y">Y</button>
        <button type="button" data-key="u" aria-label="U">U</button>
        <button type="button" data-key="i" aria-label="I">I</button>
        <button type="button" data-key="o" aria-label="O">O</button>
        <button type="button" data-key="p" aria-label="P">P</button>
      </div>

      <div class="keyboard-row keyboard-row-middle">
        <button type="button" data-key="a" aria-label="A">A</button>
        <button type="button" data-key="s" aria-label="S">S</button>
        <button type="button" data-key="d" aria-label="D">D</button>
        <button type="button" data-key="f" aria-label="F">F</button>
        <button type="button" data-key="g" aria-label="G">G</button>
        <button type="button" data-key="h" aria-label="H">H</button>
        <button type="button" data-key="j" aria-label="J">J</button>
        <button type="button" data-key="k" aria-label="K">K</button>
        <button type="button" data-key="l" aria-label="L">L</button>
      </div>

      <div class="keyboard-row">
        <button
          type="button"
          class="keyboard-wide"
          data-key="enter"
          aria-label="Enter"
        >
          Enter
        </button>

        <button type="button" data-key="z" aria-label="Z">Z</button>
        <button type="button" data-key="x" aria-label="X">X</button>
        <button type="button" data-key="c" aria-label="C">C</button>
        <button type="button" data-key="v" aria-label="V">V</button>
        <button type="button" data-key="b" aria-label="B">B</button>
        <button type="button" data-key="n" aria-label="N">N</button>
        <button type="button" data-key="m" aria-label="M">M</button>

        <button
          type="button"
          class="keyboard-wide"
          data-key="backspace"
          aria-label="Backspace"
        >
          ←
        </button>
      </div>
    </section>

    <p
      class="stage-status"
      aria-live="polite"
    >
      Stage 5 — Enter a five-letter guess
    </p>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
