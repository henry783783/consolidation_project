<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wordle-style Game</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>

  <main class="game">

    <header class="game-header">

      <h1>Wordle-style Game</h1>

      <p class="instructions">
        Guess the 5-letter word in six tries.
      </p>

      <div class="game-options">
        <label for="word-length">
          Word length:
        </label>

        <select id="word-length">
          <option value="4">4 letters</option>
          <option value="5" selected>5 letters</option>
          <option value="6">6 letters</option>
          <option value="7">7 letters</option>
          <option value="random">Random</option>
        </select>

        <button
          id="new-game"
          type="button"
          hidden
        >
          New Game
        </button>
      </div>

      <p
        class="stage-status"
        aria-live="polite"
      >
        Loading game data…
      </p>

    </header>


    <section
      class="game-board"
      aria-label="Wordle game board"
    >

      <div
        class="board"
        aria-label="Wordle board"
      ></div>

    </section>


    <section
      class="keyboard"
      aria-label="On-screen keyboard"
    >

      <div class="keyboard-row">

        <button
          type="button"
          data-key="Q"
          aria-label="Q"
        >
          Q
        </button>

        <button
          type="button"
          data-key="W"
          aria-label="W"
        >
          W
        </button>

        <button
          type="button"
          data-key="E"
          aria-label="E"
        >
          E
        </button>

        <button
          type="button"
          data-key="R"
          aria-label="R"
        >
          R
        </button>

        <button
          type="button"
          data-key="T"
          aria-label="T"
        >
          T
        </button>

        <button
          type="button"
          data-key="Y"
          aria-label="Y"
        >
          Y
        </button>

        <button
          type="button"
          data-key="U"
          aria-label="U"
        >
          U
        </button>

        <button
          type="button"
          data-key="I"
          aria-label="I"
        >
          I
        </button>

        <button
          type="button"
          data-key="O"
          aria-label="O"
        >
          O
        </button>

        <button
          type="button"
          data-key="P"
          aria-label="P"
        >
          P
        </button>

      </div>


      <div class="keyboard-row">

        <button
          type="button"
          data-key="A"
          aria-label="A"
        >
          A
        </button>

        <button
          type="button"
          data-key="S"
          aria-label="S"
        >
          S
        </button>

        <button
          type="button"
          data-key="D"
          aria-label="D"
        >
          D
        </button>

        <button
          type="button"
          data-key="F"
          aria-label="F"
        >
          F
        </button>

        <button
          type="button"
          data-key="G"
          aria-label="G"
        >
          G
        </button>

        <button
          type="button"
          data-key="H"
          aria-label="H"
        >
          H
        </button>

        <button
          type="button"
          data-key="J"
          aria-label="J"
        >
          J
        </button>

        <button
          type="button"
          data-key="K"
          aria-label="K"
        >
          K
        </button>

        <button
          type="button"
          data-key="L"
          aria-label="L"
        >
          L
        </button>

      </div>


      <div class="keyboard-row">

        <button
          type="button"
          data-key="enter"
          aria-label="Enter"
          class="wide-key"
        >
          Enter
        </button>

        <button
          type="button"
          data-key="Z"
          aria-label="Z"
        >
          Z
        </button>

        <button
          type="button"
          data-key="X"
          aria-label="X"
        >
          X
        </button>

        <button
          type="button"
          data-key="C"
          aria-label="C"
        >
          C
        </button>

        <button
          type="button"
          data-key="V"
          aria-label="V"
        >
          V
        </button>

        <button
          type="button"
          data-key="B"
          aria-label="B"
        >
          B
        </button>

        <button
          type="button"
          data-key="N"
          aria-label="N"
        >
          N
        </button>

        <button
          type="button"
          data-key="M"
          aria-label="M"
        >
          M
        </button>

        <button
          type="button"
          data-key="backspace"
          aria-label="Backspace"
          class="wide-key"
        >
          Backspace
        </button>

      </div>

    </section>

  </main>


  <script
    src="./js/game.js"
    defer
  ></script>

</body>
</html>
